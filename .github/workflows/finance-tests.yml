name: Finance tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check app.js
      - run: node --check src/finance/ledger.mjs
      - run: node --check src/finance/database.mjs
      - run: node --check src/finance/legacy-migration.mjs
